<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Publications - Rupok Islam Avi</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .publications-content { margin-top: 20px; }
    h1 { font-size: 36px; margin-bottom: 15px; }
    .year { font-size: 28px; margin: 40px 0 20px; color: #2c3e50; }
    .pub-entry { display: flex; gap: 20px; margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
    .pub-entry img { width: 200px; height: auto; border: 1px solid #ccc; border-radius: 5px; }
    .pub-content { flex: 1; }
    .pub-title { font-weight: 600; font-size: 18px; margin-bottom: 8px; color: #2c3e50; }
    .authors a { color: #b7472a; text-decoration: none; font-size: 14px; }
    .meta { font-style: italic; color: #555; font-size: 14px; margin: 8px 0; }
    .btn-row { margin-top: 12px; }
    .btn { border: 1px solid #999; background: #f9f9f9; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-right: 8px; transition: all 0.2s ease; }
    .btn:hover { background: #eee; }
    .abstract { max-height: 0; overflow: hidden; transition: all 0.4s ease; padding: 0 10px; border: 1px dashed #ddd; margin-top: 10px; font-size: 14px; line-height: 1.6; text-align: justify; }
    @media (max-width: 768px) {
      .pub-entry { flex-direction: column; align-items: center; }
      .pub-entry img { width: 100%; max-width: 400px; }
    }
  </style>
</head>
<body>

<header class="navbar-container">
  <div class="header-content">
    <img src="profile.jpg" alt="Site Logo" class="header-logo">
    <h1 class="name-header">Rupok Islam <span>Avi</span></h1>
  </div>
  <nav>
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="publications.html" class="active">Publications</a></li>
      <li><a href="research.html">Research</a></li>
      <li><a href="awards.html">Awards</a></li>
      <li><a href="project.html">Project</a></li>
      <li><a href="hobbies.html">Hobbies</a></li>
      <li><a href="certifications.html">Certifications</a></li>
      <li><a href="cv.html">CV</a></li>
    </ul>
  </nav>
</header>

<main class="publications-content">
  <h1>Publications</h1>
  <p>Publications by categories in reversed chronological order.</p>
  <p>An up-to-date list is available on <a id="scholar-link" href="#">Google Scholar</a>.<br>* denotes equal contribution</p>
  <div id="publications-list"></div>
</main>

<script src="data.js"></script>
<script>
  document.getElementById("scholar-link").href = DATA_PERSONAL.scholar;

  // Group publications by year
  const byYear = {};
  DATA_PUBLICATIONS.forEach(pub => {
    if (!byYear[pub.year]) byYear[pub.year] = [];
    byYear[pub.year].push(pub);
  });

  const container = document.getElementById("publications-list");

  // Sort years descending
  Object.keys(byYear).sort((a, b) => b - a).forEach(year => {
    const yearHeading = document.createElement("div");
    yearHeading.className = "year";
    yearHeading.textContent = year;
    container.appendChild(yearHeading);

    byYear[year].forEach((pub, i) => {
      const entry = document.createElement("div");
      entry.className = "pub-entry";

      // Authors HTML
      const authorsHTML = pub.authors
        .map(a => `<a href="#">${a}</a>`)
        .join(", ");

      // Buttons
      const paperBtn = pub.paperLink
        ? `<button class="btn" onclick="window.open('${pub.paperLink}', '_blank')">PAPER</button>`
        : "";

      entry.innerHTML = `
        <div><img src="${pub.image}" alt="${pub.title}"></div>
        <div class="pub-content">
          <div class="pub-title">${pub.title}</div>
          <div class="authors">${authorsHTML}</div>
          <div class="meta">${pub.venue}</div>
          <div class="btn-row">
            <button class="btn abs-btn">ABS</button>
            ${paperBtn}
            <button class="btn">BIB</button>
            <button class="btn">HTML</button>
          </div>
          <div class="abstract">${pub.abstract}</div>
        </div>
      `;

      // Abstract toggle
      const absBtn = entry.querySelector(".abs-btn");
      const absDiv = entry.querySelector(".abstract");
      absBtn.addEventListener("click", () => {
        // Close all others
        document.querySelectorAll(".abstract").forEach(a => {
          if (a !== absDiv) { a.style.maxHeight = null; }
        });
        document.querySelectorAll(".abs-btn").forEach(b => {
          if (b !== absBtn) { b.textContent = "ABS"; }
        });
        // Toggle this one
        if (absDiv.style.maxHeight) {
          absDiv.style.maxHeight = null;
          absBtn.textContent = "ABS";
        } else {
          absDiv.style.maxHeight = absDiv.scrollHeight + "px";
          absBtn.textContent = "HIDE";
        }
      });

      container.appendChild(entry);
    });
  });
</script>
</body>
</html>
